name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: check (${{ matrix.os }}, ${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: astral-sh/setup-uv@61cb8a9741eeb8a550a1b8544337180c0fc8476b # v7.2.0
        with:
          python-version: ${{ matrix.python }}
      - if: runner.os == 'Linux'
        run: sudo apt-get install -y liblzo2-dev && uv sync --all-extras
      - if: runner.os != 'Linux'
        run: uv sync
      - run: uv run python check all

  self-scan:
    name: fwtriage on its own corpus
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: astral-sh/setup-uv@61cb8a9741eeb8a550a1b8544337180c0fc8476b # v7.2.0
        with:
          python-version: "3.12"
      - run: uv sync
      - name: Build the exposed corpus image
        run: uv run python -c "from tests.corpus.scenarios import SCENARIOS; open('exposed.bin','wb').write(next(s for s in SCENARIOS if s.name=='exposed').build())"
      - name: Scan, and expect it to fail on the planted findings
        run: |
          set +e
          uv run fwtriage scan exposed.bin --sarif fwtriage.sarif --sbom sbom.cdx.json --no-color
          test $? -eq 1
      - if: ${{ !github.event.repository.private }}
        uses: github/codeql-action/upload-sarif@cdefb33c0f6224e58673d9004f47f7cb3e328b89 # v4.31.10
        with:
          sarif_file: fwtriage.sarif
          category: fwtriage-corpus
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: corpus-reports
          path: |
            fwtriage.sarif
            sbom.cdx.json
